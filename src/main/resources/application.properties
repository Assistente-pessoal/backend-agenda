spring.application.name=agenda-api
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/agenda}
vox.ai-service-url=${VOX_AI_SERVICE_URL:http://localhost:8000}
server.port=${SERVER_PORT:8080}
spring.data.mongodb.auto-index-creation=true

# Bind on all interfaces for local testing from a physical phone on the same Wi-Fi.
server.address=${SERVER_ADDRESS:0.0.0.0}

# Authorization: Bearer token opaco, hash armazenado no MongoDB.
auth.session-hours=${AUTH_SESSION_HOURS:24}
# Em app Android nativo CORS não é necessário. Para frontend WEB, informe origens explícitas.
auth.cors-allowed-origins=${AUTH_CORS_ALLOWED_ORIGINS:}
